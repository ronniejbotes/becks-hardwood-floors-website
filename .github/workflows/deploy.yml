name: Deploy to Hostinger over FTP (alternative)

# ALTERNATIVE to publish-deploy-branch.yml. Use one or the other, not both.
#
#   publish-deploy-branch.yml  builds -> pushes to `deploy` -> you click Deploy
#                              in hPanel. This is the one currently in use.
#   this workflow              builds -> uploads straight to public_html over
#                              FTP, fully automatic, no hPanel click.
#
# Manual-trigger only, because it would fail on every push until FTP_SERVER,
# FTP_USERNAME and FTP_PASSWORD are set. To switch to this method, add those
# three secrets and uncomment the `push:` trigger below.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Never let two deploys upload over each other.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Same variables as publish-deploy-branch.yml — see the long note
          # there. Safe defaults: temp domain, indexing off.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://lightcyan-curlew-520407.hostingersite.com' }}
          VITE_NOINDEX: ${{ vars.NOINDEX || '1' }}
          # Without this the form disables itself and says so, rather than
          # silently dropping enquiries.
          VITE_W3F_KEY: ${{ secrets.VITE_W3F_KEY }}
        run: npm run build

      - name: Fail if the build produced nothing
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "sitemap.xml missing"; exit 1; }
          test -f dist/.htaccess || { echo ".htaccess missing from dist"; exit 1; }
          echo "Build output looks sane:"
          find dist -maxdepth 2 -name index.html | sort

      - name: Upload to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Change this if the site is on an addon domain rather than the
          # primary one, e.g. ./domains/example.com/public_html/
          server-dir: ./public_html/
          # dangerous-clean-slate would wipe the remote first. Left off so a
          # failed upload cannot take the live site down with it.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
